<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Dog Gallery</title>

    <style>
        body {
            background-color: beige;
        }

        h1 {
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
        }

        .image-container {
            width: 400px;
            height: 400px;
            border: 1px solid black;
            margin-bottom: 25px;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        #fetchBtn {
            background-color: cadetblue;
            color: rgb(255, 252, 252);
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Dog Gallery</h1>
        <div class="image-container">
            <img id="dogImage" alt="Random Dog" width="400" height="300">
        </div>
        <button id="fetchBtn">Show me a dog!</button>
    </div>
    
    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const dogImage = document.getElementById('dogImage');

        async function getDogImage() {
            try {
                const response = await fetch('https://dog.ceo/api/breeds/image/random');
                const data = await response.json();

                dogImage.src = data.message;
                
                console.log("Picture loaded!");
            } catch (error) {
                console.error("Error:", error);
                alert("Error while loading the page!");
            }
        }

        fetchBtn.addEventListener('click', getDogImage);
    </script>
</body>
</html>
