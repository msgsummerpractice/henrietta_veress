name: Azure Static Web Apps CI/CD
 
on:
  push:
    branches:
      - main
      - "cloud-day-5"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - "cloud-day-5"
 
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
 
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node
     
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Angular/my-angular-app/package-lock.json
 
      - name: Install dependencies
        working-directory: Angular/my-angular-app
        run: npm ci
 
      - name: Build Angular
        working-directory: Angular/my-angular-app
        run: npm run build
 
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          NODE_VERSION: 24
          FORWARD_APP_BUILD_LOGS: true
          FORWARD_OUTPUT_PREBUILT: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_TREE_013702D10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
 
          skip_app_build: true
 
          app_location: "Angular/my-angular-app/dist/my-angular-app/browser"
          output_location: ""
          api_location: ""
 
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
 
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Angular/my-angular-app/package-lock.json
 
      - name: Install dependencies
        working-directory: Angular/my-angular-app/
        run: npm ci
 
      - name: Build Angular
        working-directory: Angular/my-angular-app/
        run: npm run build
 
      - name: Debug Output Path
        working-directory: Angular/my-angular-app/
        run: |
          echo "Listing contents of the dist directory:"
          ls -R dist/
 
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          NODE_VERSION: 24
          FORWARD_APP_BUILD_LOGS: true
          FORWARD_OUTPUT_PREBUILT: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_TREE_013702D10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
 
          skip_app_build: true
          skip_api_build: true
 
          app_location: "Angular/my-angular-app/dist/my-angular-app/browser"
          output_location: ""
          api_location: ""